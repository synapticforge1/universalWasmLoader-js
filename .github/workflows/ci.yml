# Continuous integration (Bun migration, 2026-10-12).
#
# Two jobs, because they answer different questions:
#
#   gates     — is the tree correct? types, the one-manifest rule, the browser rule, the
#               suite on Bun, lint, and the publish manifest.
#   runtimes  — does the loader actually run where the README says it does? Every current
#               Node LTS line plus the Node floor, Bun, and Deno, the SAME test file on each.
#
# NOTE: every step here is a plain `run:` step. Under the repo's first owner (`jrmarcum`), the
# Actions policy turned any third-party `uses:` (actions/checkout, oven-sh/setup-bun,
# actions/setup-node, denoland/setup-deno) into a `startup_failure` that ran no step at all.
# Since 2026-10-21 the repo is in the `synapticforge1` organization, whose policy is the same as
# binaryang's there (owner, 2026-10-21); `run:` steps work under any policy, so they stay.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      # GITHUB_REF is refs/heads/<branch> on a push and refs/pull/<n>/merge on a pull request;
      # both can be fetched by name, which a `git clone --branch` cannot do for the second.
      # Full history and the tags: the compatibility gate compares with the last release tag.
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          git fetch -q --tags origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      # `--frozen-lockfile`: a bun.lock that disagrees with package.json fails.
      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      # tsc over the published .d.ts files and scripts/, types: ["node"] pinned to the Node floor.
      - name: Type-check
        run: bun run check

      # jsr.json is the one manifest: no deno.json carrying name/version, no package.json version.
      - name: One manifest
        run: bun run manifest

      # Compatibility gate (letter H6). The committed api-surface.json must be what the source
      # generates: an intended surface change is re-baselined in its OWN commit (Rule 5).
      - name: Surface snapshot is current
        run: bun run surface --check

      # tests/ holds exactly the stamped reference fixtures (letter H7 / S4): the bytes every
      # loader port copies. Regenerated only by scripts/regen-fixtures.ts from one wasmtk commit.
      - name: Fixtures match their stamp
        run: bun run fixtures

      # The gate itself, proven able to fail (best-practices 2.1).
      - name: Compatibility gate self-test
        run: bun run compat:selftest

      # publish.yml's release step (GitHub REST API, no `gh` — letter H30) against a mock API:
      # every refusal sends no write; the happy path sends exactly the branch and the release.
      - name: Release script self-test
        run: bun run release:selftest

      # Floor since the last release + that release's tests against this source. Fails only on a
      # stale snapshot here; the floor and red previous-tag tests BLOCK at `bun run bump` and on
      # the release tag (publish.yml).
      - name: Compatibility report against the last release
        run: bun run compat

      # The export bundles for the browser AND no shipped file imports node: at the top level or
      # uses Deno./Bun. (the bundle alone cannot see a node: import: Bun stubs it out).
      - name: Every export loads in a browser
        run: bun run browser

      - name: Test (Bun)
        run: bun run test

      # The npm package (owner, 2026-10-21: `@synapticforge1/universal-wasm-loader`, as binaryang):
      # built from jsr.json into dist/, packed, the TARBALL installed into a scratch consumer and
      # run there on Node 24 and Bun (real fixtures through the published API), the shipped .d.ts
      # type-checked by a consumer, the installed package bundled for the browser, the export list
      # compared with JSR's own npm build. Nothing is published here.
      - name: npm package (built, packed, installed, run)
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.fnm" --skip-shell
          "$HOME/.fnm/fnm" install 24
          "$HOME/.fnm/fnm" exec --using=24 bun run npm:prove

      # Biome (owner, 2026-10-13), replacing deno lint: the recommended preset plus the five rules
      # deno lint's recommended set had that Biome leaves opt-in (biome.json; cmem/linting.md).
      - name: Lint
        run: bun run lint

      # Deno only for the JSR dry run: publishing still needs `deno publish` (cmem/bun-migration.md).
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Verify publish manifest (dry run, no provenance)
        run: deno publish --dry-run --allow-dirty

  runtimes:
    name: Tests on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # EVERY current Node LTS line, plus the floor (owner, 2026-10-12: "We should support
          # and test all currently available lts versions"). As of 2026-10-12: 22 "Jod"
          # (maintenance to 2027-04-30) and 24 "Krypton". Node 26 enters LTS on 2026-10-28; its
          # leg runs from 2026-10-12 (24/24 locally on 26.11.1), so the day it becomes LTS is
          # not the first time it is tested. The loader is plain JS, so 26's removal of
          # --experimental-transform-types does not touch it.
          - name: Node 22.18 (floor)
            node: '22.18'
          - name: Node 22 (LTS, latest)
            node: '22'
          - name: Node 24 (LTS, latest)
            node: '24'
          - name: Node 26 (LTS from 2026-10-28)
            node: '26'
          - name: Bun 1.4.4
            bun: true
          - name: Deno 2.x
            deno: true
    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
          git fetch -q --depth=1 origin "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      # Bun is the package manager on every leg (the suite itself needs no dependency since
      # 2026-10-21: node:test + node:assert).
      - name: Install Bun and dev dependencies
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
          "$HOME/.bun/bin/bun" install --frozen-lockfile

      - name: Test (Node ${{ matrix.node }})
        if: matrix.node
        run: |
          curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.fnm" --skip-shell
          "$HOME/.fnm/fnm" install ${{ matrix.node }}
          "$HOME/.fnm/fnm" exec --using=${{ matrix.node }} node --version
          "$HOME/.fnm/fnm" exec --using=${{ matrix.node }} node --test tests/loader.test.js

      - name: Test (Bun)
        if: matrix.bun
        run: |
          "$HOME/.bun/bin/bun" --version
          "$HOME/.bun/bin/bun" test ./tests/loader.test.js

      - name: Test (Deno)
        if: matrix.deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          "$HOME/.deno/bin/deno" --version
          "$HOME/.deno/bin/deno" test --allow-read --allow-env --allow-net=127.0.0.1 --allow-write=.test-tmp tests/loader.test.js
