name: Publish

# 🔒 The owner's order (2026-11-10, workspace release-process.md § 5, letter H33): "the CI to check
# first, then push the tag, and then create the release page from the tag, then publish the
# package to the registry". `bun run bump <level>` commits `bump to vX.Y.Z`; `bun run release`
# pushes `main` ONLY (no tag, ever, from a machine). This workflow runs on every push to `main`:
#
#   checks   {contents: read} U5. Is this a release — does jsr.json's version have no tag yet (or
#            one on THIS commit: a re-run)? If not, it stops there (ci.yml checks every push). If
#            so: the full gate, the compatibility gate in release mode, the release-script
#            self-test, the npm tarball proved, the JSR dry run on the exact tree the jsr job
#            publishes, both registries free. Every third-party tool runs here, never beside a
#            write or publishing credential. Outputs the proved dist/ digest and the names.
#   tag      {contents: write} U6. scripts/github-release.ts `tag`, fetched alone: the annotated
#            tag vX.Y.Z on this commit through the REST API, read back. A tag made with
#            GITHUB_TOKEN starts no run, so everything after it is in THIS run (`needs:`).
#   release  {contents: write} U7. `page`: the GitHub Release page FROM the tag (H32's order),
#            the JSR and npm links of the version about to be published on top. Before the
#            publish, by the owner's order.
#   jsr      {id-token: write} U8. Only the shipped files + jsr.json (a sparse fetch at this
#            commit), pinned Deno, NOTHING installed; skips when JSR has the version; deno
#            publish; the Rekor read-back, fatal.
#   npm      {id-token: write} U8. Pinned Node (npm 11.19.0 bundled) and Bun; rebuilds dist/ with
#            the dependency-free build.ts and requires checks' digest (the byte-for-byte stand-in
#            for an artifact: this repo's workflows use no `uses:`); skips when npm has the
#            version; npm publish (trusted publishing); the provenance read-back, fatal.
#
# Failure (U12): "Re-run failed jobs" — every job skips what is done (an existing tag at this
# commit, an existing page, a version the registry serves). Never a new tag for the same code,
# never a moved tag.
#
# Hardening (ledgers C30 / C34, H30, H32): no `gh`; top-level permissions {}; token-less clones;
# tools pinned by version + sha256, each pin matched to a second source; every step `run:` (the
# repo's rule since v1.0.6).

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  BUN_VERSION: "1.4.4"
  BUN_SHA256: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c"
  DENO_VERSION: "2.9.8"
  DENO_SHA256: "e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609"
  NODE_VERSION: "24.21.0"
  NODE_SHA256: "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6"

jobs:
  checks:
    name: Checks (is this a release?)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
      digest: ${{ steps.digest.outputs.digest }}
      jsr_name: ${{ steps.digest.outputs.jsr_name }}
      npm_name: ${{ steps.digest.outputs.npm_name }}
    steps:
      # Token-less, full history and tags (the compatibility gate compares with the last tag).
      - name: Checkout (no credentials)
        run: |
          git clone -q "https://github.com/${GITHUB_REPOSITORY}" .
          git checkout -q --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # A release when jsr.json's version has no tag on GitHub yet; a re-run when the tag is on THIS
      # commit; anything else (the tag on an older commit) is an ordinary push of main.
      - name: Is this a release?
        id: release
        run: |
          VERSION="$(jq -r .version jsr.json)"
          TAG="v${VERSION}"
          AT=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            | awk '{ if ($2 ~ /\^\{\}$/) p = $1; else t = $1 } END { print (p != "" ? p : t) }')
          if [ -z "$AT" ]; then STATE=new; elif [ "$AT" = "$GITHUB_SHA" ]; then STATE=rerun; else STATE=released; fi
          echo "jsr.json ${VERSION}; tag ${TAG} on GitHub: ${AT:-(absent)} -> ${STATE}"
          if [ "$STATE" = released ]; then echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::not a release version: $VERSION"; exit 1; fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"

      # A NEW release needs both registries free. npm never reuses a number, a removed one
      # included, and its package document keeps every number in `time` (ledger C34 (2)). A re-run
      # skips this: the jobs below skip what is already published.
      - name: Version free on JSR and npm
        if: steps.release.outputs.state == 'new'
        run: |
          VERSION="${{ steps.release.outputs.tag }}"; VERSION="${VERSION#v}"
          JSR=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://api.jsr.io/scopes/jrmarcum/packages/universal-wasm-loader/versions/${VERSION}?cb=${GITHUB_RUN_ID}")
          DOC=$(curl -s -o npm-doc.json -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://registry.npmjs.org/@synapticforge1%2Funiversal-wasm-loader?cb=${GITHUB_RUN_ID}")
          case "$DOC" in
            404) NPM=free ;;
            200) NPM=$(jq -r --arg v "$VERSION" 'if (.time // {} | has($v)) then "taken" else "free" end' npm-doc.json) ;;
            *) echo "::error::npm package document: HTTP $DOC"; exit 1 ;;
          esac
          rm -f npm-doc.json
          echo "JSR ${VERSION}: HTTP ${JSR}; npm ${VERSION}: ${NPM}"
          if [ "$JSR" != "404" ] || [ "$NPM" != "free" ]; then
            echo "::error::${VERSION} is not free on both registries (JSR ${JSR}, npm ${NPM})"
            exit 1
          fi

      - name: Install Bun ${{ env.BUN_VERSION }}, Node ${{ env.NODE_VERSION }}, Deno ${{ env.DENO_VERSION }} (pinned by sha256)
        if: steps.release.outputs.release == 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/node" && tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$HOME/node" --strip-components=1
          echo "$HOME/node/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/deno.zip" "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          mkdir -p "$HOME/.deno/bin" && unzip -q "$RUNNER_TEMP/deno.zip" -d "$HOME/.deno/bin"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install dev dependencies
        if: steps.release.outputs.release == 'true'
        run: bun install --frozen-lockfile

      # The gate is CI's `gates` job, on Bun (the project's runtime since 2026-10-12).
      - name: Gate (types, lint, manifest, surface, fixtures, browser, tests)
        if: steps.release.outputs.release == 'true'
        run: bun run gate

      # The compatibility gate on the candidate (letter H6): the jsr.json bump since the previous
      # tag must meet the surface floor, and for a patch / minor the previous tag's tests must pass.
      - name: Compatibility gate (release)
        if: steps.release.outputs.release == 'true'
        run: bun run compat --release

      - name: Release script self-test (scripts/github-release.ts)
        if: steps.release.outputs.release == 'true'
        run: bun run release:selftest

      # The npm tarball, built from this commit, installed into a scratch consumer and run.
      - name: npm package (built, packed, installed, run)
        if: steps.release.outputs.release == 'true'
        run: bun run npm:prove

      # What the npm job must rebuild, byte for byte, before it may publish; and the names the
      # release script needs, since its jobs check out nothing.
      - name: Digest of the proved dist/
        id: digest
        if: steps.release.outputs.release == 'true'
        run: |
          D=$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "dist/ digest: $D"
          echo "digest=$D" >> "$GITHUB_OUTPUT"
          echo "jsr_name=$(jq -r .name jsr.json)" >> "$GITHUB_OUTPUT"
          echo "npm_name=$(jq -r .name dist/package.json)" >> "$GITHUB_OUTPUT"

      # The exact tree the jsr job publishes: jsr.json and its publish.include, fetched sparsely
      # at this commit, nothing installed.
      - name: JSR publish dry run (the jsr job's tree)
        if: steps.release.outputs.release == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/jsr-tree" && cd "$RUNNER_TEMP/jsr-tree"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone /jsr.json
          git checkout -q --detach FETCH_HEAD
          git sparse-checkout set --no-cone /jsr.json $(jq -r '.publish.include[] | "/" + .' jsr.json)
          deno publish --dry-run

  tag:
    name: Tag ${{ needs.checks.outputs.tag }}
    needs: checks
    if: needs.checks.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Bun ${{ env.BUN_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # No checkout beside the write token (C30, H32): the one script, fetched alone at this commit.
      - name: Fetch the release script at this commit
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 60 -o "$RUNNER_TEMP/github-release.ts" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/github-release.ts"

      - name: Create the annotated tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          JSR_PACKAGE: ${{ needs.checks.outputs.jsr_name }}
          NPM_PACKAGE: ${{ needs.checks.outputs.npm_name }}
        run: bun "$RUNNER_TEMP/github-release.ts" tag

  release:
    name: GitHub Release ${{ needs.checks.outputs.tag }}
    needs: [checks, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Bun ${{ env.BUN_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Fetch the release script at this commit
        run: |
          curl -fsSL --retry 5 --retry-all-errors --max-time 60 -o "$RUNNER_TEMP/github-release.ts" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/github-release.ts"

      # H32's order: the tag peels to this commit; an existing page = done, nothing written; else
      # POST with the registry links on top of generated notes, read back, the tag peeled again.
      - name: Create the GitHub Release page from the tag (REST API)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          JSR_PACKAGE: ${{ needs.checks.outputs.jsr_name }}
          NPM_PACKAGE: ${{ needs.checks.outputs.npm_name }}
        run: bun "$RUNNER_TEMP/github-release.ts" page

  jsr:
    name: Publish ${{ needs.checks.outputs.tag }} to JSR
    needs: [checks, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.checks.outputs.tag }}
    steps:
      # Only what is published: jsr.json and its publish.include, at this commit; nothing installed,
      # no package.json / tsconfig.json / node_modules (measured 2026-11-10: the type check needs
      # none of them). The tag must still name this commit.
      - name: The published tree (sparse, no credentials)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone /jsr.json
          git checkout -q --detach FETCH_HEAD
          git sparse-checkout set --no-cone /jsr.json $(jq -r '.publish.include[] | "/" + .' jsr.json)
          AT=$(git ls-remote origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk '{ if ($2 ~ /\^\{\}$/) p = $1; else t = $1 } END { print (p != "" ? p : t) }')
          if [ "$AT" != "$GITHUB_SHA" ]; then echo "::error::tag ${RELEASE_TAG} is ${AT:-absent}, not this commit"; exit 1; fi
          ls -A | grep -v '^\.git$'

      - name: Install Deno ${{ env.DENO_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/deno.zip" "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  $RUNNER_TEMP/deno.zip" | sha256sum -c -
          mkdir -p "$HOME/.deno/bin" && unzip -q "$RUNNER_TEMP/deno.zip" -d "$HOME/.deno/bin"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      # Provenance requires a GitHub OIDC token; `id-token: write` injects
      # ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN. If they are absent, an org/enterprise OIDC policy is
      # blocking the token and `deno publish` silently skips provenance. A PREREQUISITE only: the
      # read-back below is the real check.
      - name: Check OIDC availability (provenance prerequisite)
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC token endpoint available — provenance prerequisites met."
          else
            echo "::warning::OIDC token NOT available (URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}, TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}). deno publish will skip provenance."
          fi

      # `deno publish` uploads, THEN signs provenance (ledger C34 (1)): a re-run after a failure
      # past the upload finds the version and goes on to the read-back.
      - name: Publish to JSR (unless JSR already has the version)
        run: |
          VERSION="${RELEASE_TAG#v}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://api.jsr.io/scopes/jrmarcum/packages/universal-wasm-loader/versions/${VERSION}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          case "$CODE" in
            200) echo "JSR already has ${VERSION} (a re-run): not uploading again" ;;
            404) deno publish ;;
            *) echo "::error::JSR version probe: HTTP $CODE"; exit 1 ;;
          esac

      # THE evidence of provenance: `deno publish` skips attestation non-fatally. JSR caches this
      # endpoint, so every read is cache-busted.
      - name: Verify provenance was recorded on JSR
        run: |
          PKG="$(jq -r .name jsr.json)"
          SCOPE=${PKG%/*}; SCOPE=${SCOPE#@}
          NAME=${PKG#*/}
          VERSION=${RELEASE_TAG#v}
          URL="https://api.jsr.io/scopes/${SCOPE}/packages/${NAME}/versions/${VERSION}"
          echo "Checking $URL"
          for i in $(seq 1 40); do
            BODY=$(curl -sf --max-time 30 -H "Accept: application/json" -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" || true)
            REKOR=$(printf '%s' "$BODY" | jq -r '.rekorLogId // empty' 2>/dev/null || true)
            if [ -n "$REKOR" ]; then
              echo "Provenance recorded — Rekor log ID: $REKOR"
              echo "- JSR: ${PKG}@${VERSION}, Rekor log ID $REKOR" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: not recorded yet, retrying in 15s"
            sleep 15
          done
          echo "::error::${PKG}@${VERSION} has no provenance (no Rekor entry). If the upload happened, the version exists and is immutable. Check the OIDC step above, the org/enterprise OIDC policy, and the JSR↔GitHub repo link."
          exit 1

  npm:
    name: Publish ${{ needs.checks.outputs.tag }} to npm
    needs: [checks, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.checks.outputs.tag }}
    steps:
      - name: Checkout this commit (no credentials)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          AT=$(git ls-remote origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk '{ if ($2 ~ /\^\{\}$/) p = $1; else t = $1 } END { print (p != "" ? p : t) }')
          if [ "$AT" != "$GITHUB_SHA" ]; then echo "::error::tag ${RELEASE_TAG} is ${AT:-absent}, not this commit"; exit 1; fi

      # npm 11.19.0 comes with this Node's Linux tarball (measured 2026-11-09): trusted publishing
      # needs >= 11.5.1, so nothing is installed globally. The check reads the version again.
      - name: Install Node ${{ env.NODE_VERSION }} and Bun ${{ env.BUN_VERSION }} (pinned by sha256)
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/node.tar.xz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/node" && tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$HOME/node" --strip-components=1
          echo "$HOME/node/bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          V="$("$HOME/node/bin/npm" --version)"
          echo "npm $V"
          if [ "$(printf '%s\n%s\n' "11.5.1" "$V" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $V is older than 11.5.1: no trusted publishing (OIDC) support"
            exit 1
          fi

      # scripts/npm/build.ts needs no dependency (node: builtins only); it must reproduce, byte for
      # byte, the dist/ that checks packed, installed and ran.
      - name: Rebuild dist/ and match the checks' digest
        run: |
          bun scripts/npm/build.ts
          D=$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "dist/ digest: $D (checks: ${{ needs.checks.outputs.digest }})"
          if [ "$D" != "${{ needs.checks.outputs.digest }}" ]; then echo "::error::dist/ differs from the one checks proved"; exit 1; fi
          if jq -e 'has("scripts")' dist/package.json > /dev/null; then echo "::error::dist/package.json has scripts: npm would run them"; exit 1; fi

      # DIAGNOSTIC (2026-10-21: v1.1.1's first try ended in ENEEDAUTH, npm's silent fallback when
      # its OIDC exchange fails). The same exchange `npm publish` makes; prints the registry's
      # answer, NEVER the token.
      - name: Trusted publishing exchange (diagnostic)
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::no GitHub OIDC endpoint: the job lacks id-token: write, or the org blocks OIDC"
            exit 1
          fi
          ID=$(curl -sf --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r '.value // empty')
          if [ -z "$ID" ]; then
            echo "::error::GitHub issued no OIDC token for audience npm:registry.npmjs.org"
            exit 1
          fi
          # What the token claims (public, not secret): the repository and workflow npm matches on.
          P=$(printf '%s' "$ID" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
          printf '%s' "$P" | base64 -d 2>/dev/null \
            | jq -c '{repository, workflow_ref, ref, environment, event_name, actor}' 2>/dev/null || true
          CODE=$(curl -s -o exchange.json -w '%{http_code}' --max-time 30 -X POST -H "Authorization: Bearer $ID" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@synapticforge1%2Funiversal-wasm-loader")
          echo "registry exchange: HTTP $CODE; token issued: $(jq -r 'if .token then "yes" else "no" end' exchange.json 2>/dev/null)"
          jq -r 'del(.token) | tostring' exchange.json 2>/dev/null || true
          rm -f exchange.json
          if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
            echo "::warning::npm refused the trusted-publishing exchange (HTTP $CODE): compare the package's trusted publisher with the claims above"
          fi

      - name: Publish to npm (unless npm already has the version)
        working-directory: dist
        run: |
          VERSION="${RELEASE_TAG#v}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -H "Cache-Control: no-cache" "https://registry.npmjs.org/@synapticforge1%2Funiversal-wasm-loader/${VERSION}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          if [ "$CODE" = "200" ]; then echo "npm already has ${VERSION} (a re-run): not uploading again"; exit 0; fi
          if [ "$CODE" != "404" ]; then echo "::error::npm version probe: HTTP $CODE"; exit 1; fi
          if ! "$HOME/node/bin/npm" publish; then
            echo "--- npm debug log, OIDC / auth lines:"
            grep -ihE 'oidc|trusted|token|auth|provenance' "$HOME"/.npm/_logs/*-debug-0.log \
              | sed -E 's/[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}/<jwt>/g; s/npm_[A-Za-z0-9]{16,}/<npm-token>/g' \
              | tail -40 || true
            exit 1
          fi

      # The evidence: the attestation read back from the registry, cache-busted, up to 10 minutes
      # (2.0.1's appeared after more than 3; 2.0.2's after 77 s).
      - name: Verify provenance was recorded on npm
        run: |
          VERSION=${RELEASE_TAG#v}
          URL="https://registry.npmjs.org/@synapticforge1%2Funiversal-wasm-loader/${VERSION}"
          for i in $(seq 1 40); do
            P=$(curl -sf --max-time 30 -H "Cache-Control: no-cache" "${URL}?cb=${GITHUB_RUN_ID}-${i}" | jq -r '.dist.attestations.provenance.predicateType // empty' 2>/dev/null || true)
            if [ -n "$P" ]; then
              echo "npm provenance recorded: $P"
              echo "- npm: @synapticforge1/universal-wasm-loader@${VERSION}, provenance $P" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt $i: not visible yet, retrying in 15s"
            sleep 15
          done
          echo "::error::@synapticforge1/universal-wasm-loader@${VERSION} has no provenance attestation on npm. If the upload happened, the version exists and is immutable."
          exit 1
